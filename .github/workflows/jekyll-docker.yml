name: Jekyll site CI

# Build check only — GitHub Pages builds and deploys the site itself, so this
# job just catches a broken build (bad _config.yml, invalid front matter)
# before it reaches the live site. It installs the Gemfile so the Jekyll
# version matches Pages (github-pages -> Jekyll 3.10), unlike the
# jekyll/builder container this replaced.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Build the site
      run: bundle exec jekyll build --future
